apiVersion: apps/v1
kind: Deployment
metadata:
  name: ldavincif-portal
  labels:
    app: ldavincif-portal
spec:
  replicas: 2 # Number of pod replicas
  selector:
    matchLabels:
      app: ldavincif-portal
  template:
    metadata:
      labels:
        app: ldavincif-portal
    spec:
      containers:
        - name: ldavincif-portal
          image: ldavincif/ldavincif-portal
          imagePullPolicy: IfNotPresent # Use Always for remote registry
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: '64Mi'
              cpu: '100m'
            limits:
              memory: '128Mi'
              cpu: '200m'
